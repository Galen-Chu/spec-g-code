<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spec G-Code — Specification Hub</title>
    <meta name="description" content="The specification hub for the G-Code ecosystem.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
    <style>
        :root {
            --base-font-size: 15px;
            --theme-color: #7c3aed;
            --heading-color: #a78bfa;
            --link-color: #8b5cf6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { padding-top: 1.5rem; }
        .sidebar-title { font-size: 1.1rem; font-weight: 700; color: #a78bfa; padding: 0 1.5rem .5rem; }
        .anchor { color: #8b5cf6; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: '📋 Spec G-Code',
            repo: 'https://github.com/Galen-Chu/spec-g-code',
            homepage: '../README.md',
            loadSidebar: '_sidebar.md',
            subMaxLevel: 3,
            search: {
                placeholder: 'Search specs...',
                noData: 'No results',
                depth: 3,
            },
            copyCode: { buttonText: 'Copy' },
            pagination: {
                previousText: 'PREV',
                nextText: 'NEXT',
            },
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
